name: Cosmic Secrets Long-Form Documentary Generator

on:
  schedule:
    # Twice a week (Tuesday & Saturday at 20:00 TRT = 17:00 UTC)
    - cron: '0 17 * * 2,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload-long:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code & History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate & Upload Long-Form Cosmic Documentary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          python long_form_cosmic.py --scheduled

      - name: Commit and Push Updated Long History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add long_history.json used_clips.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore: update cosmic documentary history [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
